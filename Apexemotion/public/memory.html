<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApexEmotion — Personal Memory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css" />
</head>
<body class="min-h-screen bg-slate-900 text-white">
  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="./index.html" class="text-xl font-bold">ApexEmotion</a>
      <nav class="hidden md:flex gap-6">
         <a class="hover:text-teal-300" href="./index.html">Home</a>
        <a class="hover:text-teal-300" href="./chat.html">Chat</a>
        <a class="hover:text-teal-300" href="./voice-companion.html">Voice Companion</a>
        <a class="hover:text-teal-300" href="./memory.html">Memory</a>
        <a class="hover:text-teal-300" href="./risk.html">Risk Engine</a>
      <a class="hover:text-teal-300" href="./alerts.html">Alerts</a>
<a class="hover:text-teal-300" href="./analytics.html">Analytics</a>
        <a class="hover:text-teal-300" href="./voice-companion.html">Voice Companion</a>
        <a class="hover:text-teal-300" href="./login.html">Login</a>
        <a class="hover:text-teal-300" href="./register.html">Register</a>

      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div class="mb-8">
      <p class="text-teal-300 text-sm font-semibold uppercase tracking-wider">Phase 7</p>
      <h1 class="text-3xl font-bold mt-2">Personal Memory</h1>
      <p class="text-slate-400 mt-2">ApexEmotion remembers useful, non-sensitive facts you choose to keep.</p>
    </div>

    <section class="grid lg:grid-cols-[1fr_1.4fr] gap-6">
      <div class="rounded-xl bg-slate-800 border border-slate-700 p-5">
        <h2 class="text-lg font-semibold">Add a memory</h2>
        <form id="memoryForm" class="mt-4 space-y-4">
          <input id="title" required maxlength="120" placeholder="Title e.g. Upcoming exams"
            class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700" />
          <textarea id="fact" required maxlength="500" rows="4"
            placeholder="e.g. My exams start next week."
            class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700"></textarea>
          <label class="block text-sm text-slate-400">Importance
            <select id="importance" class="mt-1 w-full px-3 py-2 rounded bg-slate-900 border border-slate-700">
              <option value="1">1 — Low</option>
              <option value="2">2</option>
              <option value="3" selected>3 — Normal</option>
              <option value="4">4</option>
              <option value="5">5 — High</option>
            </select>
          </label>
          <button class="w-full px-4 py-2 rounded bg-teal-500 text-slate-900 font-semibold">Save Memory</button>
        </form>
        <p id="status" class="mt-3 text-sm text-slate-400"></p>
      </div>

      <div class="rounded-xl bg-slate-800 border border-slate-700 p-5">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold">Saved memories</h2>
          <button id="refreshBtn" class="text-sm text-teal-300 hover:text-teal-200">Refresh</button>
        </div>
        <div id="memoryList" class="mt-4 space-y-3"></div>
      </div>
    </section>
  </main>

  <script type="module" src="../js/memory.js"></script>
</body>
</html>
